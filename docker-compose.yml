version: '3.8'

services:
  foni:
    build: .
    container_name: foni-voice-notes
    ports:
      - "9959:9959"
    volumes:
      # Mount autosave folder for persistent notes
      - ./autosave:/app/autosave
    environment:
      - NODE_ENV=production
      - PORT=9959
    restart: unless-stopped
    networks:
      - foni-network

networks:
  foni-network:
    driver: bridge
